services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexren}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexren}
      POSTGRES_DB: ${POSTGRES_DB:-nexren}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexren}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio  # Docker Hub no longer serves minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes: [miniodata:/data]
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend: &backend
    build: ./backend
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-nexren}:${POSTGRES_PASSWORD:-nexren}@postgres:5432/${POSTGRES_DB:-nexren}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    volumes: [./backend:/app]
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    ports: []
    command: celery -A config worker -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      backend: { condition: service_healthy }

  beat:
    <<: *backend
    ports: []
    command: celery -A config beat -l info
    healthcheck:
      disable: true
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    # Production build: routes are prebuilt, so pages serve instantly. Dev mode compiled each
    # route on first visit (~18s for /login) and the macOS bind mount made it worse.
    # For hot reload while developing, run `npm run dev` on the host instead.
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        API_PROXY_URL: http://backend:8000
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
